# =============================================================================
#  En-têtes de sécurité HTTP — site MTDPCE (frontend Angular servi par Nginx)
# -----------------------------------------------------------------------------
#  À inclure dans le bloc `server { ... }` qui sert l'application, p. ex. :
#
#      server {
#          listen 443 ssl http2;
#          server_name digital.gov.bf;
#          root /var/www/digital.gov.bf;
#          include /etc/nginx/snippets/digital-security.conf;
#          ...
#      }
#
#  NB : la version réellement installée par deploy/ est deploy/digital-security.conf
#  (racine du monorepo) — garder les deux CSP identiques.
#
#  En production, l'app, l'API (/api) et les fichiers (/uploads) sont servis
#  sur la MÊME origine via ce reverse proxy.
# =============================================================================

# --- Ne pas exposer la version de Nginx -------------------------------------
server_tokens off;

# --- Content Security Policy -------------------------------------------------
#  style-src 'unsafe-inline'          : Angular / PrimeNG / Quill injectent des styles au runtime.
#  style-src https://fonts.googleapis.com + font-src https://fonts.gstatic.com :
#                                       polices Inter / Plus Jakarta Sans (@import dans styles.scss).
#  img-src data: + https:             : images base64 de l'éditeur, miniatures YouTube,
#                                       images externes du contenu riche des articles.
#  frame-src / connect-src youtube    : médiathèque (embeds + oEmbed YouTube).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://www.youtube.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; media-src 'self' https: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

# --- Autres en-têtes de sécurité --------------------------------------------
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;

# --- HSTS : forcer HTTPS 1 an (à activer UNIQUEMENT une fois le HTTPS stable) -
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# --- Sitemap dynamique : servir l'endpoint backend, pas le fichier statique --
#  Le sitemap.xml est généré par le backend (pages + contenus publiés).
#  Ce location en correspondance EXACTE a priorité sur le fichier statique du SPA.
#  À placer dans le même server {} :
#
#      location = /sitemap.xml {
#          proxy_pass http://127.0.0.1:8096/sitemap.xml;
#          proxy_set_header Host $host;
#      }
#
#  (robots.txt référence déjà https://<domaine>/sitemap.xml — rien à changer.)

# --- Fichiers téléversés : empêcher l'exécution / le rendu inline ------------
#  Évite qu'un fichier téléversé malveillant (SVG/HTML) ne s'exécute sur
#  l'origine du site. À placer dans le location qui sert /uploads.
#
#      location /uploads/ {
#          add_header X-Content-Type-Options "nosniff" always;
#          add_header Content-Disposition "attachment" always;   # pour les non-images si besoin
#          ...
#      }
