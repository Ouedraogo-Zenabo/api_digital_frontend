  <div class="space-y-6">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold text-neutral-900">Types Projets</h1>
          <p class="text-neutral-500">Gérez les types de projets</p>
        </div>
        <button (click)="openModal()" class="btn-primary" style="background-color: #00843B;">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
          </svg>
          Nouveau Type
        </button>
      </div>
   <app-data-table [columns]="columns" [rows]="projects()" [loading]="loading()"
                   [rowActions]="actionsTpl" searchPlaceholder="Rechercher un type"
                   emptyText="Aucun type de projet" emptyHint="Cliquez sur « Nouveau » pour en créer un.">
   </app-data-table>

   <ng-template #actionsTpl let-row>
     <div class="flex justify-end gap-2">
       <button (click)="editProject(row)"
         class="p-2 border-2 border-green-500 rounded-full bg-white hover:bg-green-50 transition" title="Modifier">
         <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
           <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
             d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
         </svg>
       </button>
       <button (click)="deleteProject(row)"
         class="p-2 border-2 border-red-500 rounded-full bg-white hover:bg-red-50 transition" title="Supprimer">
         <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
           <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
             d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
         </svg>
       </button>
     </div>
   </ng-template>

   <div>
        @if (showModal()) {
        <app-drawer [title]="editingProject() ? 'Modifier le type' : 'Nouveau type de projet'" (close)="closeModal()">
            <form #projectForm="ngForm" (ngSubmit)="saveProject()" class="p-6 space-y-5">

                <!-- Nom -->
                <div>
                <label class="label">Nom <span class="text-danger-500">*</span></label>
                <input type="text" [(ngModel)]="form.name" name="name" #nameField="ngModel"
                        class="input" required>
                <!-- Erreur -->
                <p *ngIf="nameField.invalid && projectForm.submitted" class="text-sm text-red-500 mt-1">
                    Le nom est obligatoire.
                </p>
                </div>

                <!-- Description -->
                <div>
                <label class="label">Description <span class="text-danger-500">*</span></label>
                <textarea [(ngModel)]="form.description" name="description" #descField="ngModel"
                            rows="3" class="input resize-y" required></textarea>
                <!-- Erreur -->
                <p *ngIf="descField.invalid && projectForm.submitted" class="text-sm text-red-500 mt-1">
                    La description est obligatoire.
                </p>
                </div>

                <!-- Statut et Progression -->
                
               

                <!-- Dates -->
                

                <!-- Partenaire et Budget -->
               

                <!-- Actions -->
                <div class="flex justify-end gap-3 pt-4 border-t border-gray-200">

                <!-- Annuler -->
                <button type="button" (click)="closeModal()"
                        class="px-4 py-2 rounded-lg border border-red-500 text-red-500 hover:bg-red-50 transition-colors font-medium">
                    Annuler
                </button>

                <!-- Sauvegarder -->
                <button type="submit" [disabled]="saving()"
                        class="px-4 py-2 rounded-lg bg-[#00843B] text-white hover:bg-[#006830] transition-colors font-medium flex items-center justify-center gap-2">
                    @if (saving()) { 
                    <div class="spinner w-4 h-4 border-2 border-t-white border-gray-200 rounded-full animate-spin"></div> 
                    }
                    {{ editingProject() ? 'Mettre à jour' : 'Enrégistrer' }}
                </button>

                </div>
            </form>
        </app-drawer>
        }

    </div>


            <!-- Notification Modal -->
@if(notification().show) {
  <div class="fixed top-4 right-4 z-50 pointer-events-none">
    <div
      [ngClass]="{
        'bg-green-50 border-green-500 text-green-700': notification().type === 'success',
        'bg-red-50 border-red-500 text-red-700': notification().type === 'error',
        'bg-blue-50 border-blue-500 text-blue-700': notification().type === 'info'
      }"
      class="pointer-events-auto border-l-4 rounded-lg shadow-lg p-6 max-w-sm w-full flex items-center gap-4 animate-fade-in"
    >
      <svg *ngIf="notification().type === 'success'" class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
      </svg>
      <svg *ngIf="notification().type === 'error'" class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
      <svg *ngIf="notification().type === 'info'" class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M12 20a8 8 0 100-16 8 8 0 000 16z"></path>
      </svg>
      <span class="text-sm font-medium">{{ notification().message }}</span>
    </div>
  </div>
}


<!-- Modal de confirmation -->
@if(confirmModal().show) {
  <div class="fixed inset-0 bg-black/30 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 space-y-4">
      <h3 class="text-lg font-semibold text-neutral-900">Confirmation</h3>
      <p class="text-neutral-700">{{ confirmModal().message }}</p>
      
      <div class="flex justify-end gap-3 mt-4">
        <button (click)="closeConfirmModal()" 
                class="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100 transition-colors font-medium">
          Annuler
        </button>
        <button (click)="confirmModal().onConfirm()" 
                class="px-4 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700 transition-colors font-medium">
          Supprimer
        </button>
      </div>
    </div>
  </div>
}
