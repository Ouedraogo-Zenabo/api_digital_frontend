<div class="p-4 sm:p-6 max-w-4xl mx-auto">

  <!-- En-tête -->
  <div class="flex items-center gap-3 mb-6">
    <button (click)="cancel()" class="p-2 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50" title="Retour">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <div>
      <h1 class="text-2xl font-bold text-slate-800">{{ isEdit ? 'Modifier le ministère' : 'Nouveau ministère' }}</h1>
      <p class="text-slate-500 text-sm">Informations générales, missions et présentations</p>
    </div>
  </div>

  <div *ngIf="loading()" class="text-center py-10 text-slate-400 text-sm">Chargement</div>

  <form *ngIf="!loading()" (ngSubmit)="save()" class="space-y-6">

    <!-- Identité -->
    <div class="bg-white border border-slate-200 rounded-2xl p-6 space-y-4">
      <h2 class="font-semibold text-slate-800">Identité</h2>
      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Nom général <span class="text-red-500">*</span></label>
          <input type="text" [(ngModel)]="form.nomGeneral" name="nomGeneral"
                 class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#00843B]/30 focus:border-[#00843B] outline-none"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Nom d'accroche (réel) <span class="text-red-500">*</span></label>
          <input type="text" [(ngModel)]="form.nomReel" name="nomReel"
                 class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#00843B]/30 focus:border-[#00843B] outline-none"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Acronyme</label>
          <input type="text" [(ngModel)]="form.acronyme" name="acronyme"
                 class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#00843B]/30 focus:border-[#00843B] outline-none"/>
        </div>
      </div>

      <!-- Images -->
      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Logo</label>
          <div class="flex items-center gap-3">
            <img loading="lazy" *ngIf="logoPreview()" [src]="logoPreview()" alt="logo" class="w-16 h-16 rounded-lg object-contain border border-slate-100 bg-slate-50"/>
            <input type="file" accept="image/*" (change)="onLogo($event)" class="text-sm"/>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Image</label>
          <div class="flex items-center gap-3">
            <img loading="lazy" *ngIf="imagePreview()" [src]="imagePreview()" alt="image" class="w-16 h-16 rounded-lg object-cover border border-slate-100 bg-slate-50"/>
            <input type="file" accept="image/*" (change)="onImage($event)" class="text-sm"/>
          </div>
        </div>
      </div>
    </div>

    <!-- Mission -->
    <div class="bg-white border border-slate-200 rounded-2xl p-6">
      <label class="block font-semibold text-slate-800 mb-2">Mission générale</label>
      <p-editor [(ngModel)]="form.missionGeneral" name="missionGeneral"></p-editor>
    </div>

    <!-- Présentation synthétique (générale) -->
    <div class="bg-white border border-slate-200 rounded-2xl p-6">
      <label class="block font-semibold text-slate-800 mb-2">Présentation générale (synthétique)</label>
      <p-editor [(ngModel)]="form.presentationSynthetique" name="presentationSynthetique"></p-editor>
    </div>

    <!-- Présentation globale -->
    <div class="bg-white border border-slate-200 rounded-2xl p-6">
      <label class="block font-semibold text-slate-800 mb-2">Présentation globale</label>
      <p-editor [(ngModel)]="form.presentationGlobale" name="presentationGlobale"></p-editor>
    </div>

    <!-- Actions -->
    <div class="flex justify-end gap-3">
      <button type="button" (click)="cancel()" class="px-5 py-2 text-sm border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-50">Annuler</button>
      <button type="submit" [disabled]="saving()" class="px-5 py-2 text-sm bg-[#00843B] text-white rounded-lg hover:bg-[#006e31] disabled:opacity-50">
        {{ saving() ? 'Enregistrement' : (isEdit ? 'Mettre à jour' : 'Créer') }}
      </button>
    </div>
  </form>
</div>

<div *ngIf="notification().show"
  class="fixed bottom-5 right-5 z-[60] px-4 py-3 rounded-lg shadow-lg text-sm text-white"
  [ngClass]="notification().type === 'success' ? 'bg-[#00843B]' : 'bg-red-600'">
  {{ notification().message }}
</div>
