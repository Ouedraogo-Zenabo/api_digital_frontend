  <div class="space-y-6">
      <!-- Header -->
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold text-neutral-900">Ministère</h1>
          <p class="text-neutral-500">Gérez les ministères</p>
        </div>
        <button (click)="openModal()" class="btn-primary" style="background-color: #00843B;">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
          </svg>
          Nouvel ministère
        </button>
      </div>
      
      <!-- Table -->
      <app-data-table [columns]="columns" [rows]="articles()" [loading]="loading()"
                      [rowActions]="actionsTpl" searchPlaceholder="Rechercher un ministère"
                      emptyText="Aucun ministère pour le moment"
                      emptyHint="Cliquez sur « Nouveau » pour en créer un.">
      </app-data-table>

      <ng-template #actionsTpl let-row>
        <div class="flex justify-end gap-2">
          <button (click)="viewArticle(row)"
                  class="flex items-center justify-center p-2 border-2 border-blue-500 rounded-full bg-white hover:bg-blue-50 transition-colors" title="Voir">
            <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            </svg>
          </button>
          <button (click)="editArticle(row)"
                  class="flex items-center justify-center p-2 border-2 border-green-500 rounded-full bg-white hover:bg-green-50 transition-colors" title="Modifier">
            <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
            </svg>
          </button>
          <button (click)="deleteArticle(row)"
                  class="flex items-center justify-center p-2 border-2 border-red-500 rounded-full bg-white hover:bg-red-50 transition-colors" title="Supprimer">
            <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
            </svg>
          </button>
        </div>
      </ng-template>
      
      
      <!-- Modal -->
      @if (showModal()) {
        <div class="fixed inset-0 bg-slate-900/40 flex justify-end z-[60]">
          <div class="bg-white shadow-2xl w-full max-w-xl h-full overflow-y-auto rounded-l-2xl drawer-anim ml-auto">
            <div class="p-6 border-b border-neutral-200">
              <h2 class="text-xl font-semibold text-neutral-900">
              {{ editingArticle() ? "Modifier l'article" : 'Nouvel article' }}
            </h2>

            </div>
            
            <form #articleForm="ngForm" (ngSubmit)="saveArticle()"  class="p-6 space-y-5" novalidate>
              <div>
                <label class="label">Nom Général <span class="text-red-500">*</span></label>

                <input type="text"
                      [(ngModel)]="form.nomGeneral"
                      name="nomGeneral"
                      #title="ngModel"
                      class="input"
                      required>

               
              </div>

               <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <div>
                <label class="label">Nom d'accroche <span class="text-red-500">*</span></label>

                <input type="text"
                      [(ngModel)]="form.nomReel"
                      name="nomReel"
                      #title="ngModel"
                      class="input"
                      required>

                
              </div>

              
             <div>
                <label class="label">Acronyme<span class="text-red-500">*</span></label>

                <input type="text"
                      [(ngModel)]="form.acronyme"
                      name="acronyme"
                      #title="ngModel"
                      class="input"
                      required>

                
              </div>


               </div>

              

              <div>
                    <label class="label">Mission Générale</label>
                    <textarea [(ngModel)]="form.missionGeneral" name="missionGeneral" rows="2" class="input resize-y"></textarea>
                </div>

              <div>
                    <label class="label">Présentation synthétique</label>
                    <textarea [(ngModel)]="form.presentationSynthetique" name="presentationSynthetique" rows="3" class="input resize-y"></textarea>
                </div>

              <div>
                    <label class="label">Présentation globale</label>
                    <textarea [(ngModel)]="form.presentationGlobale" name="presentationGlobale" rows="5" class="input resize-y"></textarea>
                </div>


             <div>
                <label class="label">Logo <span class="text-red-500">*</span></label>
                <input type="file" (change)="onFileSelected($event)" accept="image/*" class="input">
              </div>

               <div>
                <label class="label">Image pour Première Page <span class="text-red-500">*</span></label>
                <input type="file" (change)="onFileSelected1($event)" accept="image/*" class="input">
              </div>

              
             
              
              <div class="flex justify-end gap-3 pt-4 border-t border-neutral-200">
                <button type="button" (click)="closeModal()" class="px-4 py-2 rounded-lg border border-red-500 text-red-500 hover:bg-red-50 transition-colors font-medium">Annuler</button>
                <button type="submit" [disabled]="saving()" class="px-4 py-2 rounded-lg bg-[#00843B] text-white hover:bg-[#006830] transition-colors font-medium flex items-center justify-center gap-2">
                  @if (saving()) {
                    <div class="spinner w-4 h-4 mr-2"></div>
                  }
                  {{ editingArticle() ? 'Mettre à jour' : 'Créer' }}
                </button>
              </div>
            </form>
          </div>
        </div>
      }
    </div>



    <!-- Notification Modal -->
@if(notification().show) {
  <div class="fixed top-4 right-4 z-50 pointer-events-none">
    <div
      [ngClass]="{
        'bg-green-50 border-green-500 text-green-700': notification().type === 'success',
        'bg-red-50 border-red-500 text-red-700': notification().type === 'error',
        'bg-blue-50 border-blue-500 text-blue-700': notification().type === 'info'
      }"
      class="pointer-events-auto border-l-4 rounded-lg shadow-lg p-6 max-w-sm w-full flex items-center gap-4 animate-fade-in"
    >
      <svg *ngIf="notification().type === 'success'" class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
      </svg>
      <svg *ngIf="notification().type === 'error'" class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
      <svg *ngIf="notification().type === 'info'" class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M12 20a8 8 0 100-16 8 8 0 000 16z"></path>
      </svg>
      <span class="text-sm font-medium">{{ notification().message }}</span>
    </div>
  </div>
}



<!-- Modal de confirmation -->
@if(confirmModal().show) {
  <div class="fixed inset-0 bg-black/30 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 space-y-4">
      <h3 class="text-lg font-semibold text-neutral-900">Confirmation</h3>
      <p class="text-neutral-700">{{ confirmModal().message }}</p>
      
      <div class="flex justify-end gap-3 mt-4">
        <button (click)="closeConfirmModal()" 
                class="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100 transition-colors font-medium">
          Annuler
        </button>
        <button (click)="confirmModal().onConfirm()" 
                class="px-4 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700 transition-colors font-medium">
          Supprimer
        </button>
      </div>
    </div>
  </div>
}
